<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Music Player</title>
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            background: rgba(22, 28, 46, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 35px 40px 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
        }

        /* ----- HEADER ----- */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .player-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #eaeef7;
            letter-spacing: -0.2px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 11px;
            font-weight: 500;
            color: #8892b0;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ----- NOW PLAYING ----- */
        .now-playing {
            text-align: center;
            padding: 12px 0 18px;
        }

        .track-title {
            font-size: 22px;
            font-weight: 600;
            color: #f0f3fe;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 15px;
            color: #8892b0;
            font-weight: 400;
        }

        /* ----- PROGRESS BAR ----- */
        .progress-section {
            margin: 18px 0 20px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #6a7294;
            font-variant-numeric: tabular-nums;
            margin-bottom: 4px;
        }

        .progress-track {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            cursor: pointer;
            transition: height 0.15s;
        }

        .progress-track:hover {
            height: 7px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6c8cff, #a78bfa);
            border-radius: 12px;
            transition: width 0.05s linear;
            pointer-events: none;
        }

        /* ----- CONTROLS ----- */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin: 16px 0 22px;
        }

        .controls button {
            background: none;
            border: none;
            color: #c8cee8;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transform: scale(1.02);
        }

        .controls button:active {
            transform: scale(0.95);
        }

        .controls .play-btn {
            font-size: 38px;
            width: 66px;
            height: 66px;
            background: linear-gradient(135deg, #5b7cfa, #8b6cf0);
            color: #fff;
            border: none;
            box-shadow: 0 8px 24px rgba(91, 124, 250, 0.25);
        }

        .controls .play-btn:hover {
            background: linear-gradient(135deg, #6e8cff, #9b7cf5);
            box-shadow: 0 12px 32px rgba(91, 124, 250, 0.35);
            transform: scale(1.04);
        }

        .controls .play-btn:active {
            transform: scale(0.92);
        }

        /* ----- VOLUME & EXTRAS ----- */
        .extra-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .volume-wrap svg {
            color: #6a7294;
            width: 18px;
            height: 18px;
            opacity: 0.7;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.08);
            height: 4px;
            border-radius: 12px;
            width: 100%;
            max-width: 120px;
            transition: background 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8b9cff;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(91, 124, 250, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8b9cff;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .repeat-btn {
            background: none;
            border: none;
            color: #6a7294;
            font-size: 20px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 30px;
            transition: all 0.15s;
            opacity: 0.6;
        }

        .repeat-btn.active {
            color: #a78bfa;
            opacity: 1;
        }

        .repeat-btn:hover {
            opacity: 1;
            color: #c8cee8;
        }

        /* ----- PLAYLIST ----- */
        .playlist {
            margin-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 18px;
            max-height: 210px;
            overflow-y: auto;
        }

        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #3c4566;
            border-radius: 20px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s;
            color: #a8b2d9;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #eaeef7;
        }

        .playlist-item.active {
            background: rgba(91, 124, 250, 0.12);
            color: #ffffff;
            border-left: 3px solid #7c8cff;
        }

        .playlist-item .track-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .playlist-item .track-duration {
            font-size: 13px;
            color: #5a6382;
            font-variant-numeric: tabular-nums;
        }

        .playlist-item.active .track-duration {
            color: #8b9cff;
        }

        /* ----- empty state ----- */
        .empty-message {
            text-align: center;
            color: #5a6382;
            font-size: 14px;
            padding: 28px 0 12px;
        }

        .empty-message span {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            opacity: 0.6;
        }

        /* responsive */
        @media (max-width: 480px) {
            .player-container {
                padding: 24px 18px 28px;
                border-radius: 28px;
            }
            .controls {
                gap: 16px;
            }
            .controls .play-btn {
                width: 58px;
                height: 58px;
                font-size: 32px;
            }
            .controls button {
                width: 44px;
                height: 44px;
                font-size: 24px;
            }
            .track-title {
                font-size: 18px;
            }
            .playlist-item .track-name {
                max-width: 130px;
            }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Header -->
        <div class="player-header">
            <h1>🎵 GitHub Tunes</h1>
            <span class="badge">streaming · no server</span>
        </div>

        <!-- Now Playing -->
        <div class="now-playing">
            <div class="track-title" id="trackTitle">—</div>
            <div class="track-artist" id="trackArtist">upload your tracks</div>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="progress-track" id="progressTrack">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prevBtn" aria-label="Previous">⏮</button>
            <button class="play-btn" id="playBtn" aria-label="Play / Pause">▶</button>
            <button id="nextBtn" aria-label="Next">⏭</button>
        </div>

        <!-- Volume + Repeat -->
        <div class="extra-controls">
            <div class="volume-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 14v-4h4l5-5v14l-5-5H3z" />
                    <path d="M18 8a6 6 0 010 8" />
                    <path d="M21 5a10 10 0 010 14" />
                </svg>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
            </div>
            <button class="repeat-btn" id="repeatBtn" aria-label="Repeat">🔁</button>
        </div>

        <!-- Playlist -->
        <div class="playlist" id="playlistContainer">
            <!-- items will be rendered by JS -->
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // --------------------------------------------------------------
            // 1.  YOUR TRACK LIST — edit this array!
            //     Each object: { title, artist, url }
            //     The 'url' MUST be a direct link to the audio file.
            //     For GitHub: use the "raw" URL, e.g.:
            //     https://raw.githubusercontent.com/username/repo/branch/folder/song.mp3
            // --------------------------------------------------------------
           
            // --------------------------------------------------------------
            // 2.  DOM refs
            // --------------------------------------------------------------
            const audio = new Audio();
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const repeatBtn = document.getElementById('repeatBtn');
            const progressFill = document.getElementById('progressFill');
            const progressTrack = document.getElementById('progressTrack');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const trackTitle = document.getElementById('trackTitle');
            const trackArtist = document.getElementById('trackArtist');
            const volumeSlider = document.getElementById('volumeSlider');
            const playlistContainer = document.getElementById('playlistContainer');

            // --------------------------------------------------------------
            // 3.  State
            // --------------------------------------------------------------
            let currentIndex = 0;
            let isPlaying = false;
            let repeatMode = false;        // false = stop after track ends, true = loop single track
            let isDragging = false;        // progress scrub

            // --------------------------------------------------------------
            // 4.  Helper: format time (seconds → MM:SS)
            // --------------------------------------------------------------
            function formatTime(sec) {
                if (!sec || isNaN(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            // --------------------------------------------------------------
            // 5.  Load & play a track by index
            // --------------------------------------------------------------
            function loadTrack(index) {
                const track = TRACKS[index];
                if (!track) return;

                // update UI
                trackTitle.textContent = track.title || 'Untitled';
                trackArtist.textContent = track.artist || 'Unknown artist';

                // set audio source
                audio.src = track.url;
                audio.load();

                // reset progress
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                totalTimeEl.textContent = '0:00';

                // highlight playlist
                const items = playlistContainer.querySelectorAll('.playlist-item');
                items.forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });

                // if we were playing, auto‑play
                if (isPlaying) {
                    audio.play().catch(() => { /* user interaction may be needed */ });
                }

                // update button icon
                updatePlayButton();
            }

            // --------------------------------------------------------------
            // 6.  Play / Pause
            // --------------------------------------------------------------
            function togglePlay() {
                if (TRACKS.length === 0) return;

                if (isPlaying) {
                    audio.pause();
                } else {
                    // if no track loaded or ended, load current
                    if (!audio.src || audio.ended) {
                        loadTrack(currentIndex);
                    }
                    audio.play().catch(err => {
                        // Autoplay may be blocked; user will click again.
                        console.warn('Playback start failed:', err);
                    });
                }
                // state toggled in 'play' / 'pause' events
            }

            function updatePlayButton() {
                playBtn.textContent = isPlaying ? '⏸' : '▶';
            }

            // --------------------------------------------------------------
            // 7.  Next / Previous
            // --------------------------------------------------------------
            function nextTrack() {
                if (TRACKS.length === 0) return;
                currentIndex = (currentIndex + 1) % TRACKS.length;
                const wasPlaying = isPlaying;
                isPlaying = false;   // prevent auto‑play from loadTrack
                loadTrack(currentIndex);
                if (wasPlaying) {
                    isPlaying = true;
                    audio.play().catch(() => {});
                }
                updatePlayButton();
            }

            function prevTrack() {
                if (TRACKS.length === 0) return;
                currentIndex = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
                const wasPlaying = isPlaying;
                isPlaying = false;
                loadTrack(currentIndex);
                if (wasPlaying) {
                    isPlaying = true;
                    audio.play().catch(() => {});
                }
                updatePlayButton();
            }

            // --------------------------------------------------------------
            // 8.  Render playlist
            // --------------------------------------------------------------
            function renderPlaylist() {
                if (TRACKS.length === 0) {
                    playlistContainer.innerHTML = `
                        <div class="empty-message">
                            🎵 No tracks<br />
                            <span>add URLs to the TRACKS array</span>
                        </div>
                    `;
                    return;
                }

                let html = '';
                TRACKS.forEach((track, i) => {
                    const active = i === currentIndex ? 'active' : '';
                    html += `
                        <div class="playlist-item ${active}" data-index="${i}">
                            <span class="track-name">${track.title || 'Untitled'}</span>
                            <span class="track-duration">${track.artist || ''}</span>
                        </div>
                    `;
                });
                playlistContainer.innerHTML = html;

                // click handler for playlist items
                playlistContainer.querySelectorAll('.playlist-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        const idx = parseInt(this.dataset.index, 10);
                        if (idx === currentIndex && isPlaying) {
                            // same track: just restart?
                            audio.currentTime = 0;
                            return;
                        }
                        const wasPlaying = isPlaying;
                        isPlaying = false;
                        currentIndex = idx;
                        loadTrack(currentIndex);
                        if (wasPlaying) {
                            isPlaying = true;
                            audio.play().catch(() => {});
                        }
                        updatePlayButton();
                    });
                });
            }

            // --------------------------------------------------------------
            // 9.  Audio event bindings
            // --------------------------------------------------------------
            // Time update
            audio.addEventListener('timeupdate', () => {
                if (isDragging) return;
                const progress = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
                progressFill.style.width = `${Math.min(100, progress)}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
            });

            // Play
            audio.addEventListener('play', () => {
                isPlaying = true;
                updatePlayButton();
            });

            // Pause
            audio.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayButton();
            });

            // Ended
            audio.addEventListener('ended', () => {
                if (repeatMode) {
                    // loop current track
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                } else {
                    // go to next
                    nextTrack();
                }
            });

            // Error (e.g., 404)
            audio.addEventListener('error', (e) => {
                console.warn('Audio error:', e);
                // if track fails, skip to next
                if (TRACKS.length > 1) {
                    nextTrack();
                }
            });

            // --------------------------------------------------------------
            // 10.  Progress bar scrubbing (click + drag)
            // --------------------------------------------------------------
            function setProgressFromMouse(e) {
                const rect = progressTrack.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const clamped = Math.min(1, Math.max(0, x));
                if (audio.duration) {
                    audio.currentTime = clamped * audio.duration;
                }
                progressFill.style.width = `${clamped * 100}%`;
            }

            progressTrack.addEventListener('mousedown', (e) => {
                isDragging = true;
                setProgressFromMouse(e);
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    setProgressFromMouse(e);
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // touch support
            progressTrack.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isDragging = true;
                const touch = e.touches[0];
                const fakeMouse = { clientX: touch.clientX };
                setProgressFromMouse(fakeMouse);
            });

            progressTrack.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const fakeMouse = { clientX: touch.clientX };
                setProgressFromMouse(fakeMouse);
            });

            progressTrack.addEventListener('touchend', () => {
                isDragging = false;
            });

            // --------------------------------------------------------------
            // 11.  Volume
            // --------------------------------------------------------------
            volumeSlider.addEventListener('input', () => {
                audio.volume = parseFloat(volumeSlider.value);
            });
            audio.volume = parseFloat(volumeSlider.value);

            // --------------------------------------------------------------
            // 12.  Repeat toggle
            // --------------------------------------------------------------
            repeatBtn.addEventListener('click', () => {
                repeatMode = !repeatMode;
                repeatBtn.classList.toggle('active', repeatMode);
            });

            // --------------------------------------------------------------
            // 13.  Control buttons
            // --------------------------------------------------------------
            playBtn.addEventListener('click', togglePlay);
            nextBtn.addEventListener('click', nextTrack);
            prevBtn.addEventListener('click', prevTrack);

            // keyboard shortcuts (space, left/right arrows)
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextTrack();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevTrack();
                }
            });

            // --------------------------------------------------------------
            // 14.  Init
            // --------------------------------------------------------------
            function init() {
                renderPlaylist();
                if (TRACKS.length > 0) {
                    loadTrack(0);
                    // preload metadata for duration display
                    audio.addEventListener('loadedmetadata', () => {
                        totalTimeEl.textContent = formatTime(audio.duration);
                    });
                } else {
                    trackTitle.textContent = 'No tracks';
                    trackArtist.textContent = 'add songs to the list';
                }
            }

            init();

            // optional: expose TRACKS for easy debugging
            window.__player = { audio, TRACKS, currentIndex, loadTrack, nextTrack, prevTrack, togglePlay };

        })();
    </script>

</body>
</html>
